<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responder Dashboard</title>

<link rel="stylesheet" href="styles.css">
<script src="https://kit.fontawesome.com/96e37b53f1.js" crossorigin="anonymous"></script>
</head>

<body>

<header class="topbar">
<h2>Responder Dashboard</h2>
</header>

<!-- Sidebar -->
<nav id="sidebar">
<ul>
<li><a href="#"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
<li><a href="#"><i class="fa-solid fa-triangle-exclamation"></i> Incident</a></li>
<li><a href="#"><i class="fa-solid fa-heart-pulse"></i> Vitals</a></li>
<li><a href="#"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
<li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
</ul>
</nav>

<main class="container">

<div class="monitor-card">

<h2>Vital Monitoring</h2>

<!-- Heart -->
<svg class="medical-heart" viewBox="0 0 64 64">
<defs>
<radialGradient id="heartGradient">
<stop offset="0%" stop-color="#ff6b6b"/>
<stop offset="100%" stop-color="#9b4e44"/>
</radialGradient>
</defs>

<path fill="url(#heartGradient)"
d="M32 58 L10 36 C4 30 4 20 10 14 C16 8 26 10 32 18 C38 10 48 8 54 14 C60 20 60 30 54 36 Z"/>
</svg>

<div class="label">Heart Rate</div>

<!-- Responsive Ring -->
<svg class="progress-ring" viewBox="0 0 200 200">
<circle class="ring-bg" cx="100" cy="100" r="85"/>
<circle class="ring-progress" cx="100" cy="100" r="85"/>
</svg>

<div class="bpm-text">
<span id="bpm">82</span> BPM
</div>

</div>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav">
<a href="#" class="bottom-item"><i class="fa-solid fa-gauge"></i><span>Home</span></a>
<a href="#" class="bottom-item"><i class="fa-solid fa-triangle-exclamation"></i><span>Incident</span></a>
<a href="#" class="bottom-item"><i class="fa-solid fa-heart-pulse"></i><span>Vitals</span></a>
<a href="#" class="bottom-item"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
</nav>

</body>
</html>
