<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responder Login</title>

<style>
body{
font-family:Arial;
background:#e3e5e8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#dd4c56;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#msg{
margin-top:15px;
text-align:center;
color:red;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Responder Login</h2>

<form onsubmit="login(event)">

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div id="msg"></div>

</div>

<script>

function login(e){

e.preventDefault();

let email = document.getElementById("email").value.trim();
let password = document.getElementById("password").value.trim();

let formData = new FormData();
formData.append("email",email);
formData.append("password",password);

fetch("api/login_responder.php",{
method:"POST",
body:formData
})

.then(res=>res.json())
.then(data=>{

if(data.status === "success"){

window.location="index.php";

}else{

document.getElementById("msg").innerHTML="Invalid Email or Password";

}

})

.catch(()=>{

document.getElementById("msg").innerHTML="Server Error";

});

}

</script>

</body>
</html>
